plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hatblack2002.permafrost'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.hatblack2002.permafrost"
        minSdk 24          /* OpenGL ES 3.1 devices; 3.2 features validated on target */
        targetSdk 34
        versionCode 2
        versionName "0.2.0-android-game"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-24"
            }
        }
    }

    buildTypes {
        debug {
            /* Keep symbols for on-device startup log triage
             * (android/README.md evidence rule). */
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets.main {
        /* SDLActivity Java glue is reused straight from the vendored SDL2
         * (Apache-2.0) instead of being duplicated into this repository. */
        java.srcDirs += '../../engine/deps/SDL2/android-project/app/src/main/java'
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    lint {
        abortOnError false
    }
}
