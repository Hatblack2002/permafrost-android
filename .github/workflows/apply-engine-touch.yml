name: Apply Android touch adaptation to vendored engine

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch-raycast-touch.py"
      - ".github/workflows/apply-engine-touch.yml"

permissions:
  contents: write

jobs:
  apply-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify vendored upstream revision
        shell: bash
        run: |
          source upstream.lock
          test -f engine/src/map/raycast.c
          git -C engine rev-parse --is-inside-work-tree >/dev/null 2>&1 || true
          grep -q "$UPSTREAM_REF" engine/UPSTREAM_SOURCE.txt
      - name: Apply touch raycast adaptation to actual engine source
        run: python3 scripts/patch-raycast-touch.py engine
      - name: Verify adaptation anchors and registrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("engine/src/map/raycast.c")
          s = p.read_text()
          required = [
              "static int s_touch_x;",
              "static bool s_touch_active;",
              "static void on_touch_pointer(void *user, void *event)",
              "E_Global_Register(SDL_FINGERDOWN, on_touch_pointer",
              "E_Global_Register(SDL_FINGERMOTION, on_touch_pointer",
              "E_Global_Register(SDL_FINGERUP, on_touch_pointer",
              "E_Global_Unregister(SDL_FINGERDOWN, on_touch_pointer",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing touch adaptation markers: " + repr(missing))
          if s.count("static void on_touch_pointer(void *user, void *event)") != 1:
              raise SystemExit("Touch handler duplicated")
          print("Touch adaptation markers verified.")
          PY
      - name: Commit adapted original engine source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/map/raycast.c
          if git diff --cached --quiet; then
            echo "Touch adaptation already applied."
            exit 0
          fi
          git commit -m "android: adapt original raycast to SDL touch input [skip ci]"
          git push origin HEAD:main
