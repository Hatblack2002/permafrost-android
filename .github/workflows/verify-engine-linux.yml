name: Verify upstream engine builds on Linux

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/src/**"
      - "engine/Makefile"
      - "engine/deps/**"
      - ".github/workflows/verify-engine-linux.yml"

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake autoconf automake libtool pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxss-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libgl1-mesa-dev
      - name: Prepare upstream dependencies
        working-directory: engine
        run: |
          # GLEW's auto-generation target copies generated files into src/,
          # but the upstream source archive does not track that empty directory.
          mkdir -p deps/GLEW/src
          make deps
      - name: Compile the original engine with Android touch changes
        working-directory: engine
        run: make pf
