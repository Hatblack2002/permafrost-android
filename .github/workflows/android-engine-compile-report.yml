name: Android engine compile report

on:
  workflow_dispatch:
  push:
    paths:
      - "android/app/jni/**"
      - "android/tests/**"
      - "scripts/patch-glew-gles.py"
      - "scripts/patch-sched-arm64.py"
      - "scripts/patch-simd-arm64.py"
      - "engine/src/**"
      - ".github/workflows/android-engine-compile-report.yml"

permissions:
  contents: read

jobs:
  engine-compile:
    name: Compile engine for arm64-v8a (report, not a port claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply GLES, AArch64 scheduler and SIMD patches in-place
        run: |
          python3 scripts/patch-glew-gles.py engine
          python3 scripts/patch-sched-arm64.py engine
          python3 scripts/patch-simd-arm64.py engine

      - name: Build AArch64 layout guard
        working-directory: android/tests
        run: |
          # Offsets must match context_switch.S; compile with the guard's
          # assertions active (arch-independent C, so the host compiler
          # can syntax-check it with the aarch64 define forced on).
          gcc -fsyntax-only -D__aarch64__ sched_ctx_offsets.c

      - name: Locate ndk-build (fail hard if missing)
        id: ndk
        run: |
          set -euo pipefail
          for cand in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_LATEST_HOME:-}" \
                      /usr/local/lib/android/sdk/ndk-bundle; do
            if [ -n "$cand" ] && [ -x "$cand/ndk-build" ]; then
              echo "ndk-build=$cand/ndk-build" >> "$GITHUB_OUTPUT"
              echo "Using ndk-build at $cand/ndk-build"
              exit 0
            fi
          done
          # Last resort: newest NDK installed under the Android SDK dir.
          found=$(ls /usr/local/lib/android/sdk/ndk/*/ndk-build 2>/dev/null \
                    | sort -V | tail -1 || true)
          if [ -n "$found" ]; then
            echo "ndk-build=$found" >> "$GITHUB_OUTPUT"
            echo "Using ndk-build at $found"
            exit 0
          fi
          echo "::error::ndk-build not found on runner; report would be empty"
          exit 1

      - name: Compile engine sources for arm64-v8a (keep-going)
        working-directory: android/app/jni
        run: |
          set +e
          "${{ steps.ndk.outputs.ndk-build }}" -k -B \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android-engine.mk \
            NDK_OUT=obj-report \
            > compile.log 2>&1
          status=$?
          echo "ndk-build exit status: $status"
          cp compile.log "$GITHUB_WORKSPACE/engine-compile.log"

      - name: Guard against an empty/false-positive report
        working-directory: android/app/jni
        run: |
          set -euo pipefail
          # The report workflow intentionally survives compile errors
          # (ndk-build -k), but it must NOT "succeed" if compilation never
          # actually happened (bad makefile, wrong NDK root, empty log).
          if [ ! -s compile.log ]; then
            echo "::error::compile.log is empty; ndk-build produced no output"
            exit 1
          fi
          compiles=$(grep -c '\[arm64-v8a\] Compile' compile.log || true)
          errors=$(grep -c 'error:' compile.log || true)
          echo "compile actions: $compiles, error diagnostics: $errors"
          if [ "$compiles" -eq 0 ] && [ "$errors" -eq 0 ]; then
            echo "::error::no '[arm64-v8a] Compile' lines and no errors in log;"
            echo "::error::ndk-build likely failed before compiling any file."
            tail -30 compile.log
            exit 1
          fi
          echo "engine C sources compiled or attempted: OK"

      - name: Summarize per-file compile evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("engine-compile.log").read_text(errors="replace")
          # ndk-build prints "[abs]/path/to/file.c:line:col: error: ..."
          failed = sorted(set(re.findall(
              r"engine/src/[^\s:'\"]+?\.(?:c|S):\d+:\d+: error:", log)))
          failed_files = sorted(set(m.split(":")[0] for m in failed))
          srcs = []
          for pat in ["*.c", "*/*.c", "*/*/*.c"]:
              srcs += Path("engine/src").rglob(pat)
          srcs = sorted(set(p for p in srcs
                            if not p.name.startswith("py_")))
          print("### Android engine compile report (arm64-v8a)")
          print("")
          print(f"- engine C sources considered: {len(srcs)} "
                "(Python scripting subsystem excluded)")
          print(f"- distinct files with compile errors: {len(failed_files)}")
          print(f"- total error diagnostics: {len(failed)}")
          if failed_files:
              print("")
              print("| file | errors |")
              print("|------|--------|")
              for f in failed_files:
                  n = len([m for m in failed if m.startswith(f + ":")])
                  print(f"| `{f}` | {n} |")
          lines = ["## Android engine compile report (arm64-v8a)", "",
                   f"engine C sources considered: {len(srcs)} "
                   "(Python scripting subsystem excluded)",
                   f"files with errors: {len(failed_files)}",
                   f"total error diagnostics: {len(failed)}", ""]
          lines += [f"- {f}" for f in failed_files]
          Path("compile-summary.md").write_text("\n".join(lines) + "\n")
          PY

      - name: Append summary to job summary
        if: always()
        run: cat compile-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload compile log and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-engine-arm64-compile-report
          path: |
            engine-compile.log
            compile-summary.md
          if-no-files-found: error

      - name: Evidence disclaimer
        if: always()
        run: |
          echo "A compiled file is compile-level evidence only. It does not" >> "$GITHUB_STEP_SUMMARY"
          echo "claim the engine links, launches, or renders on a device." >> "$GITHUB_STEP_SUMMARY"
